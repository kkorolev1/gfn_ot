# Train a second acyclic GFlowNet with R(x) = p_teacher(x)**beta.
defaults:
  - tb_amp
  - _self_

init_logZ: null
init_logZ_num_samples: 256

environment:
  reward_type: gflownet
  # Relative to gfn_ot, or supply an absolute path to another source checkpoint.
  sampler_checkpoint: envs/amp/checkpoint/sampler.npz
  beta: 2.0
