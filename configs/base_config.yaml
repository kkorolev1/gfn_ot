defaults:
  - algorithm: prefix_tb_hypergrid
  - _self_

seed: 0
use_jit: True
logger: json  # json | comet
log_dir: null  # Parent directory for unique run folders; null uses Hydra's run directory.
checkpoint_filename: checkpoint.msgpack  # Replaced at every evaluation.
batch_size: 512
eval_frequency: 40
# Rolling evaluation capacity; append batch_size samples at each evaluation.
# Also the size of each independent target subset for the startup TV baseline.
eval_buffer_size: 2000000

comet:
  api_key: ${oc.env:COMET_API_KEY,null}
  project_name: gfn_ot
  workspace: ${oc.env:COMET_WORKSPACE,null}
  exp_name: ""
