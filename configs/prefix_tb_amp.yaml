name: prefix_tb_amp

env:
  _target_: envs.amp.amp.AMPEnvironment
  beta: 2.0
  checkpoint: envs/amp/checkpoint/sampler.npz

train_rollout_max_length: 10
train_num_steps: 100000

eval_rollout_max_length: 100
eval_batch_size: 16

sinkhorn:
  # Second acyclic GFlowNet trained on this source model's p(x)**beta.
  target_checkpoint: envs/amp/checkpoint/sampler_tempered_beta=2.npz
  # Use min(sample_size, number of naturally completed eval trajectories).
  sample_size: 2048
  epsilon: 1e-3 # Absolute regularization in Hamming-distance units (one edit = 1).
  threshold: 1e-4
  max_iterations: 2000

# null calibrates these once from a source batch; this is not an exact logZ.
init_logZ: null
flow_penalty_log_scale: null
lr: 1e-3
logZ_lr: 1e-1
grad_clip: 0
reg_coef: 0.1
use_weights: False

model:
  max_length: 60
  nchar: 20
  num_layers: 3
  num_hid: 256

lr_schedule:
  # type: constant  # multistep | cosine | constant
  type: multistep
  milestones: [1000, 2000, 3000, 4000]
  gamma: 0.95

buffer:
  use: False
  replay_ratio: 2
  max_length_in_batches: 100
  prioritize_by: "reward"  # none, reward, loss
  sampling_method: "systematic"  # multinomial, stratified, systematic, rank
  rank_k: 0.01  # only used if sampling_method is rank
  sample_with_replacement: True
  prefill_steps: 0  # collect `prefill_steps` batches before starting training
  update_score: False
